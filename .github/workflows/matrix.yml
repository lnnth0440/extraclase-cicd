name: Matrix Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test-matrix:
    name: Node ${{ matrix.node }} - ${{ matrix.os }}

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os:
          - ubuntu-latest
          - windows-latest

        node:
          - 18
          - 20
          - 22

    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Mostrar versiones
        run: |
          node --version
          pnpm --version

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Ejecutar lint
        run: pnpm run lint

      - name: Ejecutar pruebas
        run: pnpm run test