name: Matrix Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test-matrix:
    name: Node ${{ matrix.node }} - ${{ matrix.os }}

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - os: ubuntu-latest
            node: 18
            pnpm: 9

          - os: ubuntu-latest
            node: 20
            pnpm: 10

          - os: ubuntu-latest
            node: 22
            pnpm: 11

          - os: windows-latest
            node: 18
            pnpm: 9

          - os: windows-latest
            node: 20
            pnpm: 10

          - os: windows-latest
            node: 22
            pnpm: 11

    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ matrix.pnpm }}

      - name: Mostrar versiones
        run: |
          node --version
          pnpm --version

      - name: Instalar dependencias
        run: pnpm install

      - name: Ejecutar lint
        run: pnpm run lint

      - name: Ejecutar pruebas
        run: pnpm run test