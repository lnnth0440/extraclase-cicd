name: Matrix Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test-matrix:
    name: Node ${{ matrix.node-version }} - ${{ matrix.os }}

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
          - 23
          - 24
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Mostrar versiones
        run: |
          node --version
          pnpm --version

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Ejecutar lint
        run: pnpm run lint

      - name: Ejecutar pruebas
        run: pnpm run test