name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Descargar código
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Construir artefacto desplegable
        run: |
          tar -czf extraclase-cicd.tar.gz \
            src \
            package.json \
            pnpm-lock.yaml

      - name: Subir artefacto desplegable
        uses: actions/upload-artifact@v4
        with:
          name: extraclase-cicd-production
          path: extraclase-cicd.tar.gz
          retention-days: 7

      - name: Desplegar en Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --show-error --silent \
            -X POST "$RENDER_DEPLOY_HOOK_URL"